<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>vid2bin – video to frame animation for tiny displays</title>
<style>
:root{--bg:#161a28;--panel:#1e2335;--line:#2e3550;--ink:#e6e9f5;--mute:#8d96b8;--acc:#8b9bff;--ok:#5fd4a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
main{display:grid;grid-template-columns:330px 1fr;gap:20px;max-width:1240px;margin:0 auto;padding:24px}
@media(max-width:860px){main{grid-template-columns:1fr}}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
h2{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:600}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
input[type=number],select{width:130px;background:#141829;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:6px 8px;font:inherit}
input[type=range]{accent-color:var(--acc);width:100%}
input[type=file]{width:100%;color:var(--mute)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--acc);color:#10142a}
button.alt{background:#2a3150;color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.stage{grid-template-columns:1fr}}
figure{margin:0}
figcaption{color:var(--mute);margin-bottom:6px}
.view{position:relative;background:#0b0e18;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:140px;display:grid;place-items:center}
#box{cursor:crosshair;touch-action:none;user-select:none}
video{display:block;width:100%;height:auto}
#sel{position:absolute;border:2px solid var(--acc);box-shadow:0 0 0 9999px rgba(8,10,20,.62);pointer-events:none}
canvas#cv{width:100%;image-rendering:pixelated;background:#000;display:block}
#info{margin:12px 0;color:var(--mute)}
progress{width:100%;height:8px;accent-color:var(--ok)}
</style></head><body><main>
<aside>
  <h1>vid2bin</h1><p class="sub">Video in. Frame-perfect .bin or Arduino code out.</p>
  <div class="panel"><h2>Video</h2><input type="file" id="file" accept="video/*"></div>
  <div class="panel"><h2>Timing</h2>
    <label>Start (s)<input type="number" id="t0" value="0" min="0" step="0.1"></label>
    <label>End (s)<input type="number" id="t1" value="0" min="0" step="0.1"></label>
    <label>Frames per second<input type="number" id="fps" value="10" min="1" max="60"></label></div>
  <div class="panel"><h2>Size and crop</h2>
    <label>Display<select id="preset"><option value="">Custom</option><option>128x64</option><option>128x32</option><option>64x48</option><option>250x122</option><option>296x128</option></select></label>
    <label>Width<input type="number" id="w" value="128" min="8"></label>
    <label>Height<input type="number" id="h" value="64" min="8"></label>
    <label>Keep crop ratio<input type="checkbox" id="lock" checked></label>
    <p class="sub" style="margin:6px 0 8px">Drag on the video to crop.</p>
    <button class="alt" id="reset">Reset crop</button></div>
  <div class="panel"><h2>Look</h2>
    <label>Threshold<span id="thv">128</span></label><input type="range" id="th" min="0" max="255" value="128">
    <label>Dither<input type="checkbox" id="dither"></label>
    <label>Invert<input type="checkbox" id="invert"></label>
    <label>Byte layout<select id="mode"><option value="h">Horizontal</option><option value="v">Vertical (SSD1306)</option></select></label></div>
  <button id="go" disabled style="width:100%">Convert to frames</button>
  <progress id="bar" value="0" max="1" style="margin-top:10px"></progress>
</aside>
<section>
  <div class="stage">
    <figure><figcaption>Source</figcaption><div class="view" id="box"><video id="v" muted playsinline></video><div id="sel"></div></div></figure>
    <figure><figcaption>Result</figcaption><div class="view"><canvas id="cv" width="128" height="64"></canvas></div></figure>
  </div>
  <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" style="margin-top:12px" aria-label="Preview position">
  <div id="info">Choose a video to begin.</div>
  <div class="row"><button id="dlbin" disabled>Download .bin</button><button id="dlcode" class="alt" disabled>Download Arduino .h</button></div>
</section></main>
<script>
const $=id=>document.getElementById(id), v=$('v'), cv=$('cv'), cx=cv.getContext('2d'), sc=document.createElement('canvas'), sx=sc.getContext('2d',{willReadFrequently:true});
const S={};['t0','t1','fps','w','h','lock','th','dither','invert','mode','preset'].forEach(k=>S[k]=$(k));
let crop={x:0,y:0,w:1,h:1}, frames=[], timer=null, drag=null;

// ---- load ----
function load(f){ if(!f) return; stop(); frames=[]; v.src=URL.createObjectURL(f);
  v.onloadedmetadata=()=>{ S.t0.value=0; S.t1.value=v.duration.toFixed(2); $('scrub').max=v.duration; crop={x:0,y:0,w:1,h:1}; drawCrop(); sync('w'); $('go').disabled=false; seek(0).then(upd); }; }
$('file').onchange=e=>load(e.target.files[0]);
document.body.ondragover=e=>e.preventDefault();
document.body.ondrop=e=>{e.preventDefault(); load(e.dataTransfer.files[0]);};

// ---- helpers ----
const seek=t=>new Promise(r=>{ if(Math.abs(v.currentTime-t)<.001) return r(); const d=()=>{v.onseeked=null;r()}; v.onseeked=d; setTimeout(d,2000); v.currentTime=Math.min(t,v.duration||t); });
function sync(from){ if(!S.lock.checked||!v.videoWidth) return; const a=crop.h*v.videoHeight/(crop.w*v.videoWidth);
  if(from==='h') S.w.value=Math.max(8,Math.round(S.h.value/a)); else S.h.value=Math.max(8,Math.round(S.w.value*a)); }
function drawCrop(){ const s=$('sel').style; s.left=crop.x*100+'%'; s.top=crop.y*100+'%'; s.width=crop.w*100+'%'; s.height=crop.h*100+'%'; }
function stop(){ clearInterval(timer); timer=null; }

// ---- frame -> 1-bit pixels (0/1 per pixel) ----
function grab(){ const W=+S.w.value, H=+S.h.value; sc.width=W; sc.height=H; const vw=v.videoWidth, vh=v.videoHeight;
  sx.fillStyle='#000'; sx.fillRect(0,0,W,H); sx.drawImage(v,crop.x*vw,crop.y*vh,crop.w*vw,crop.h*vh,0,0,W,H);
  const d=sx.getImageData(0,0,W,H).data, g=new Float32Array(W*H), out=new Uint8Array(W*H), th=+S.th.value, inv=S.invert.checked?1:0, dt=S.dither.checked;
  for(let i=0;i<W*H;i++) g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=y*W+x, o=g[i], n=o>=th?255:0;
    if(dt){ const e=o-n; if(x+1<W) g[i+1]+=e*7/16; if(y+1<H){ if(x>0) g[i+W-1]+=e*3/16; g[i+W]+=e*5/16; if(x+1<W) g[i+W+1]+=e/16; } }
    out[i]=(n?1:0)^inv; }
  return out; }
function show(px){ const W=+S.w.value, H=+S.h.value; if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const im=cx.createImageData(W,H); for(let i=0;i<W*H;i++){ const c=px[i]?255:0; im.data.set([c,c,c,255],i*4); } cx.putImageData(im,0,0); }

// ---- pack bits ----
function pack(px,W,H,mode){ let o;
  if(mode==='h'){ const bw=Math.ceil(W/8); o=new Uint8Array(bw*H); for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(px[y*W+x]) o[y*bw+(x>>3)]|=128>>(x&7); }
  else { o=new Uint8Array(Math.ceil(H/8)*W); for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(px[y*W+x]) o[(y>>3)*W+x]|=1<<(y&7); }
  return o; }
const packAll=()=>frames.map(f=>pack(f,+S.w.value,+S.h.value,S.mode.value));

// ---- preview + info ----
function info(){ const W=+S.w.value, H=+S.h.value, n=Math.max(0,Math.floor((S.t1.value-S.t0.value)*S.fps.value));
  const bpf=S.mode.value==='h'?Math.ceil(W/8)*H:Math.ceil(H/8)*W; $('info').textContent=`${n} frames · ${W}×${H} · ${bpf} bytes/frame · ${(n*bpf/1024).toFixed(1)} KB total`; }
function upd(){ stop(); if(v.videoWidth) show(grab()); info(); }
S.w.oninput=()=>{sync('w');upd();}; S.h.oninput=()=>{sync('h');upd();};
['t0','t1','fps','lock','dither','invert','mode'].forEach(k=>S[k].oninput=upd);
S.th.oninput=()=>{$('thv').textContent=S.th.value; upd();};
S.preset.onchange=()=>{ if(!S.preset.value) return; const [w,h]=S.preset.value.split('x').map(Number); S.w.value=w; S.h.value=h;
  if(v.videoWidth){ const r=w/h, vr=v.videoWidth/v.videoHeight; const cw=vr>r?r/vr:1, ch=vr>r?1:vr/r; crop={x:(1-cw)/2,y:(1-ch)/2,w:cw,h:ch}; drawCrop(); } upd(); };
$('reset').onclick=()=>{crop={x:0,y:0,w:1,h:1}; drawCrop(); sync('w'); upd();};
$('scrub').oninput=async e=>{ await seek(+e.target.value); upd(); };

// ---- crop by dragging ----
const pt=e=>{ const r=v.getBoundingClientRect(), c=n=>Math.min(1,Math.max(0,n)); return [c((e.clientX-r.left)/r.width), c((e.clientY-r.top)/r.height)]; };
$('box').onpointerdown=e=>{ if(!v.videoWidth) return; drag=pt(e); $('box').setPointerCapture(e.pointerId); };
$('box').onpointermove=e=>{ if(!drag) return; const [x,y]=pt(e); crop={x:Math.min(drag[0],x),y:Math.min(drag[1],y),w:Math.max(.02,Math.abs(x-drag[0])),h:Math.max(.02,Math.abs(y-drag[1]))}; drawCrop(); sync('w'); upd(); };
$('box').onpointerup=()=>{drag=null;};

// ---- convert: strictly sequential, frames[i] always = i-th timestamp ----
$('go').onclick=async()=>{ stop(); const fps=+S.fps.value, t0=+S.t0.value, n=Math.floor((S.t1.value-t0)*fps);
  if(n<1) return alert('Nothing to convert: the end time must be later than the start time.');
  $('go').disabled=true; frames=new Array(n);
  for(let i=0;i<n;i++){ await seek(t0+i/fps); frames[i]=grab(); show(frames[i]); $('bar').value=(i+1)/n; }
  $('go').disabled=false; $('dlbin').disabled=$('dlcode').disabled=false; info();
  let k=0; timer=setInterval(()=>show(frames[k++%n]),1000/fps); };

// ---- export ----
function save(parts,name,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(parts,{type})); a.download=name; a.click(); }
$('dlbin').onclick=()=>save(packAll(),'animation.bin','application/octet-stream');
$('dlcode').onclick=()=>{ const W=+S.w.value, H=+S.h.value, n=frames.length, p=packAll(), names=[];
  let s=`// ${W}x${H}, ${n} frames, ${S.fps.value} fps, ${S.mode.value==='h'?'horizontal':'vertical (SSD1306 pages)'} 1 bit per pixel, ${p[0].length} bytes per frame\n// On AVR read with pgm_read_byte / pgm_read_ptr.\n\n`;
  p.forEach((b,i)=>{ const nm='frame_'+String(i).padStart(4,'0'); names.push(nm); const L=[];
    for(let k=0;k<b.length;k+=16) L.push('  '+Array.from(b.subarray(k,k+16),x=>'0x'+x.toString(16).padStart(2,'0')).join(', '));
    s+=`const unsigned char ${nm}[] PROGMEM = {\n${L.join(',\n')}\n};\n`; });
  s+=`\nconst int FRAME_COUNT = ${n};\nconst int FRAME_FPS = ${S.fps.value};\nconst unsigned char* const frames[FRAME_COUNT] PROGMEM = {\n  ${names.join(',\n  ')}\n};\n`;
  save([s],'animation.h','text/plain'); };
</script></body></html>
